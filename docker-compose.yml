services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tg
      POSTGRES_PASSWORD: tg
      POSTGRES_DB: tg
    ports:
      - "54329:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./artefato/src/aeroledger/sql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./artefato/src/aeroledger/sql/02_leitura.sql:/docker-entrypoint-initdb.d/02_leitura.sql:ro
      - ./artefato/src/aeroledger/sql/03_postgis.sql:/docker-entrypoint-initdb.d/03_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg -d tg"]
      interval: 5s
      retries: 20

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    depends_on:
      db:
        condition: service_healthy
    environment:
      AEROLEDGER_DSN: postgresql://tg:tg@db:5432/tg
      AEROLEDGER_DSN_ADMIN: postgresql://tg:tg@db:5432/postgres
    ports:
      - "8888:8888"
    volumes:
      - .:/tg

volumes:
  dados:
