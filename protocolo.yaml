    TODA: "TORA + CWY"
    ASDA: "TORA + SWY"
    LDA:  "comprimento da pista − deslocamento de cabeceira (zero em SBSJ)"

H2:
  afirmacao: "Todo dado não-premissa é calculado, não armazenado."
  refutada_se: "trocar uma premissa exigir reescrever dados derivados (seeds)."
  teste_decisivo: >-
    Ato 1: comprimento, azimute e distâncias declaradas derivados batem com o
    AIP. Ato 4: após troca de referencial, zero seeds alteradas e geometria
    igual ao gabarito transformado.

  metodo_de_derivacao:             # fixado antes, para o resultado não escolher o método
    comprimento: "distância geodésica entre THR16 e THR34 sobre o GRS80 (altura elipsoidal zero)"
    azimute_verdadeiro: "azimute geodésico em cada cabeceira, apontando para a oposta"
    rumo_magnetico: "azimute verdadeiro + 22° (VAR oeste), comparado ao inteiro publicado"

  efeitos_sistematicos_declarados: # fora da tolerância; só orientam a classificação de falha
    inclinacao: "+0,143 m — Δh²/2L com Δh = 647 − 619,3 m"
    altura_elipsoidal: "+0,259 m — L·h/R com h ≈ 616,7 m"
    leitura: >-
      Se a falha do comprimento for de até 0,402 m com o derivado MENOR que o
      publicado, a causa provável é a superfície de cálculo (o publicador pode
      medir sobre o terreno). Veredito continua FALHOU; classificação:
      implementação (método), não arquitetura.

  ato1:                            # Fase A, sobre o estado após a fundação AIRAC 2604
    instante: "t₁, fim do ato 1"
    verificacoes:
      - {id: H2.01, grandeza: "comprimento da pista",              oraculo: "F3 col. 3 / F1",     publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - {id: H2.02, grandeza: "azimute verdadeiro em THR16",       oraculo: "F3 col. 2",          publicado: 134.93, unidade: grau, tolerancia: 0.014}
      - {id: H2.03, grandeza: "azimute verdadeiro em THR34",       oraculo: "F3 col. 2",          publicado: 314.92, unidade: grau, tolerancia: 0.014}
      - {id: H2.04, grandeza: "rumo magnético RWY 16",             oraculo: "F1 BRG MAG",         publicado: 157,    unidade: grau, tolerancia: 1.009}
      - {id: H2.05, grandeza: "rumo magnético RWY 34",             oraculo: "F1 BRG MAG",         publicado: 337,    unidade: grau, tolerancia: 1.009}
      - {id: H2.06, grandeza: "TORA 16",                           oraculo: "F4 (AD 2.13)",       publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - {id: H2.07, grandeza: "TODA 16",                           oraculo: "F4 (AD 2.13)",       publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - {id: H2.08, grandeza: "ASDA 16",                           oraculo: "F4 (AD 2.13)",       publicado: 2958,   unidade: m,    tolerancia: 1.419}
      - {id: H2.09, grandeza: "LDA 16",                            oraculo: "F4 (AD 2.13)",       publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - {id: H2.10, grandeza: "TORA 34",                           oraculo: "F4 (AD 2.13)",       publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - {id: H2.11, grandeza: "TODA 34",                           oraculo: "F4 (AD 2.13)",       publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - {id: H2.12, grandeza: "ASDA 34",                           oraculo: "F4 (AD 2.13)",       publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - {id: H2.13, grandeza: "LDA 34",                            oraculo: "F4 (AD 2.13)",       publicado: 2675,   unidade: m,    tolerancia: 0.919}
      - id: H2.14
        grandeza: "derivados ausentes do ledger"
        predicao: >-
          Zero linhas em event_field cujo último segmento do path seja tora,
          toda, asda, lda, azimute, azimuth, rumo ou bearing (qualquer feature),
          e zero linhas com comprimento/length na feature runway.
        oraculo: "consulta ao próprio ledger"
        tolerancia: 0                # contagem
    origem_das_tolerancias:
      comprimento: "0,5 m (publicado a 1 m) + 0,419 m (0,005\" nas duas cabeceiras, projetado no eixo)"
      azimute: "0,005° (publicado a 0,01°) + 0,009° (mesmo arredondamento, projetado na normal, ÷ L)"
      rumo_magnetico: "0,5° (BRG MAG inteiro) + 0,5° (VAR inteira) + 0,009°"
      ASDA16: "tolerância do comprimento + 0,5 m (SWY publicada a 1 m)"
      nota: "o plano previa 0,5 m para as distâncias declaradas; não sai da precisão de publicação, porque TORA herda o erro de L."

  ato4:                            # Fase B, nova medição
    cenario:                       # premissa do cenário, fixada antes; gabarito conhecido
      descricao: >-
        THR 34 remedida: 1,00 m para fora no prolongamento do eixo (134,92°)
        e 0,50 m para sudoeste (224,92°), republicada a 0,01".
        Deslocamento efetivo após o arredondamento: 0,966 m.
      THR34_v2: {lat: "231412.24S", lon: "0455112.45W", elev_m: 647}
      THR16_v2: "inalterada"
      escrita_esperada: "um novo corpo de referencial (novo ref_id) e um DELTA na feature airport"
    regra_de_resolucao_de_seed:    # premissa de arquitetura que o teste exige explicitar
      forma: "seed = (referente, s, o) — ISO 19148: DistanceExpression a partir de um Referent + LateralOffset"
      s: "distância geodésica ao longo do eixo, a partir do referente, positiva em direção ao outro referente"
      o: "afastamento lateral geodésico, positivo à direita de quem anda do referente para o outro"
      implementacao_do_gabarito: "gabarito/geodesia.py :: resolver()"
    vertices_verificados:
      - {seed: "RWY canto 16-dir",  referente: THR16, s: 0,    o:  22.5}
      - {seed: "RWY canto 16-esq",  referente: THR16, s: 0,    o: -22.5}
      - {seed: "RWY canto 34-dir",  referente: THR34, s: 0,    o:  22.5}
      - {seed: "RWY canto 34-esq",  referente: THR34, s: 0,    o: -22.5}
      - {seed: "SWY canto ext-dir", referente: THR34, s: -283, o:  22.5}
      - {seed: "SWY canto ext-esq", referente: THR34, s: -283, o: -22.5}
    verificacoes:
      - {id: H2.15, predicao: "exatamente 1 evento entre o início e o fim do ato 4: DELTA na feature airport, único path alterado = ref_id", tolerancia: 0}
      - {id: H2.16, predicao: "zero eventos em features portadoras de seed (runway, protect_area, taxiway, apron) no ato 4", tolerancia: 0}
      - {id: H2.17, predicao: "nenhum path de comprimento ou distância declarada escrito no ato 4 (o comprimento novo é derivado, não digitado)", tolerancia: 0}
      - {id: H2.18, predicao: "cada vértice verificado, resolvido pelo motor com ref v1 e com ref v2, coincide com o gabarito", oraculo: "gabarito/geodesia.py", tolerancia_m: 0.0005}
      - {id: H2.19, predicao: "comprimento e azimutes derivados pelo motor com ref v2 coincidem com o gabarito (inversa THR16 → THR34_v2)", oraculo: "gabarito/geodesia.py", tolerancia: "0,0005 m; azimute 0,0005/L rad (1,1e-5°)"}
    origem_das_tolerancias:
      numerica: "0,5 mm — exatidão declarada da fórmula de Vincenty (1975), o algoritmo menos exato dos dois lados da comparação."
      leitura_de_falha: >-
        Se o motor usar outra superfície (projeção plana local, UTM) e passar de
        0,5 mm, é implementação. Se algum vértice exigir alterar a seed para
        coincidir (ex.: seed com estaca absoluta a partir de THR16 e fim da
        pista digitado como número), é arquitetura: H2 refutada.

  fora_deste_protocolo:
    ato2_barreira: >-
      Também é derivação (R12), mas depende da regra de distâncias declaradas
      com barreira, adiada nas decisões. Entra na v0.2 do protocolo.

# ---------------------------------------------------------------------------

H1:
  afirmacao: >-
    Para o uso ADC, primitivos simples (ponto, retângulo, coroa) geram
    envoltórias conservadoras dentro da tolerância do contrato.
  refutada_se: "algum elemento do ADC exigir forma fora dos primitivos para caber na tolerância."
  divisao_do_teste: >-
    O layout de taxiways e pátios entra digitalizado do ADC (entrada). Compará-lo
    com o mesmo ADC não valida posição; só testa se os primitivos conseguem
    representar a forma. Por isso H1 se divide em duas perguntas diferentes.
    H1a (expressividade): todos os elementos de área, contra o contorno da carta.
    H1b (posição): só os elementos gerados de premissas do AIP (RWY e SWY),
    contra o desenho da carta, que é fonte independente da tabela AD 2.12.

  oraculo:
    fonte: F1
    natureza: >-
      PDF vetorial (2264 objetos na folha 1, sem imagem raster). Escala
      aproximada 1:21 000 (7,38 m por ponto tipográfico, pela gratícula de 30").
      Traço dos contornos: 0,48 pt, cerca de 3,5 m no terreno.
    georreferenciamento: >-
      Transformação afim ajustada por mínimos quadrados às interseções da
      gratícula impressa (S23 13 00 a S23 14 30; W045 51 00 a W045 52 00).
      Resíduo máximo do ajuste registrado como r_cal.
    procedimento: "adc/calibrar_adc.py, adc/extrair_contornos.py, adc/adc_geo.py (hashes em artefatos_registrados)"
    calibracao:
      resultado: "r_cal = 0,18 m (adc/calibracao.json)"
      tiques: "latitude 40/40 (resíduo máx 0,01 m); longitude 31/32 (resíduo máx 0,17 m)"
      excluido: "tique de 45°51'06\" na base, desenhado 7,4 m fora do lugar (resíduo 92 vezes a mediana); erro de desenho do próprio tique"
      projecao_da_carta: "gratícula girada 0,33° em relação à moldura: a carta está em norte de quadrícula (UTM), não em norte verdadeiro"
      alcance: "r_cal mede a consistência da gratícula, não a fidelidade das feições ao terreno; esta é o que H1b mede"
    unidade_de_teste: >-
      Cada contorno como a carta o desenha, sem segmentação manual: um objeto
      de preenchimento do PDF é uma unidade; um anel contido em outro do mesmo
      objeto é furo (teste geométrico de contenção); os demais anéis são
      unidades próprias. Designações (TWY A–E, APN 1–8) só rotulam, não cortam.
      Assim nenhum recorte pode ser ajustado ao resultado.
    consequencia: >-
      A precisão do oráculo (metros) é pior que a exatidão do contrato
      (0,5 a 1 m). A posição só pode ser validada na precisão da carta; a
      exatidão de levantamento exigida pelo PANS-AIM não é testável com este
      oráculo. Limite declarado, não contornado.

  contrato_ADC:                    # tolerâncias de H1a; conferir no documento (bloqueio)
    fonte: "Anexo 14 Vol. I, App. 5, Tab. A5-1 (8ª ed.), transposta ao PANS-AIM (Doc 10066), App. 1"
    exatidao_de_pontos:
      cabeceira_fim_e_eixo_de_pista: 1.0
      eixo_de_taxiway: 0.5
      limite_de_patio_poligono: 1.0
      ARP: 30.0
    nivel_de_confianca: >-
      PANS-AIM, Doc 10066, nota (7): exatidões de dados aeronáuticos são a 95%
      de confiança; ponto com duplo papel usa a exatidão mais exigente;
      obstáculos e terreno a 90% (fora do escopo de H1).
    papel_duplo: "borda compartilhada entre elementos de classes diferentes (ex.: TWY entrando em APN) usa a menor tolerância das duas"
    regra: "tolerância de borda = exatidão dos pontos que a definem + metade da meia-resolução da dimensão publicada (a borda dista w/2 do eixo)"
    tolerancias_de_contrato_m:   # valores ainda não conferidos no catálogo; não decidem o veredito
      RWY: 1.25         # 1,0 + 0,25 (largura a 1 m)
      SWY: 1.25         # definida pela cabeceira 34 (1,0) + largura (0,25)
      STRIP: 1.25       # mesma regra; posição longitudinal é entrada (ver achado)
      TWY: 0.75         # 0,5 + 0,25
      APN: 1.0          # limite de pátio publicado como polígono
    regra_de_tolerancia: >-
      tolerância = max(exatidão do contrato, precisão do oráculo). Abaixo da
      precisão do oráculo a carta não distingue uma forma da outra, então
      exigir menos que isso não é testável com este oráculo.
    precisao_do_oraculo:
      H1a: "meia espessura do traço do contorno = 0,48 pt × 7,38 m/pt ÷ 2 = 1,77 m (envoltória e contorno estão no mesmo referencial da carta; o erro de georreferenciamento se cancela)"
      H1b: "r_cal + 1,77 = 0,18 + 1,77 = 1,95 m (geometria do AIP contra desenho da carta: o georreferenciamento entra)"
    tolerancias_m:      # as que decidem: max(contrato, 1,77)
      RWY: 1.77
      SWY: 1.77
      STRIP: 1.77
      TWY: 1.77
      APN: 1.77
    condicao_de_reabertura: >-
      Se algum valor confirmado no catálogo der tolerância de contrato maior que
      1,77 m, a tolerância daquela classe passa a ser a do contrato, em nova
      versão do protocolo registrada antes da execução de H1.
    o_que_H1_testa: >-
      Que os primitivos cabem na precisão da carta. O nível de exatidão do
      contrato (0,5 a 1,25 m) não é testável com este oráculo; limite declarado.
    achado_strip: >-
      3118 − 2675 − 283 = 160 m além de pista + SWY, sem divisão publicada entre
      as pontas (na AOC 2213: 60 + 60 m). A posição longitudinal da faixa entra
      digitalizada; só a forma é testada.

  primitivos:
    vocabulario: [ponto, retangulo, coroa]
    composicao: "permitida, com limite: nº de primitivos ≤ nº de trechos do contorno de referência (segmentos retos máximos + arcos)."
    razao_do_limite: >-
      Sem limite, qualquer forma é aproximada por retângulos suficientes e H1
      fica infalseável. O limite sai do próprio contorno: um primitivo por
      trecho é representar; mais que isso é ajustar.
    coroa_conservadora: "arco externo circunscrito, arco interno inscrito"
    LOD_da_coroa: >-
      N_min = menor número de segmentos com flecha R·(1 − cos(θ/2N)) ≤
      tolerância da classe (contrato_ADC.tolerancias_m); testar em N_min, 2·N_min e 4·N_min.
    nos: >-
      Auxílios (LOC/DME, GP, PAPI, MALSR, TWR, RFFS) e ARP são nós só
      topológicos com posição; não têm envoltória e ficam fora de H1. Resolve,
      para o uso ADC, a tensão "degeneração em nó não é conservadora".

  elementos: "pista (972), SWY (974), faixa (788) e todas as unidades de pavimento de contornos_brutos.geojson; classe TWY ou APN para a tolerância é indiferente, pois as duas valem 1,77 m"

  verificacoes:
    - id: H1.01
      escopo: "cada elemento, em cada LOD"
      predicao: "contenção: contorno de referência ⊆ envoltória"
      metrica: "distância de Hausdorff dirigida (contorno → envoltória)"
      tolerancia_m: 1.0e-6
      origem: "guarda numérica: 6 ordens acima do arredondamento float64 em coordenadas de 10⁴ m e 5 abaixo da menor tolerância de classe"
    - id: H1.02
      escopo: "cada elemento, no LOD N_min"
      predicao: "desvio: percentil 95 da distância entre a borda da envoltória e o contorno ≤ tolerância da classe"
      metrica: "distância ponto-a-contorno amostrada ao longo da borda da envoltória a cada 0,1 m; o máximo (Hausdorff) é reportado, não decide"
      tolerancia: "contrato_ADC.tolerancias_m (max entre contrato e oráculo)"
      origem: "o contrato define exatidão a 95% (nota 7); exigir 100% testaria algo que o consumidor não pede. A contenção (H1.01) continua em 100%, porque ser conservador é propriedade do modelo, não do contrato."
    - id: H1.03
      escopo: "cada elemento"
      predicao: "nº de primitivos ≤ nº de trechos do contorno"
      contagem: "n_trechos de contornos_brutos.geojson: itens do caminho no PDF, retas colineares (desvio < 0,01 pt) fundidas, curva = 1 trecho, somados os anéis do elemento"
      tolerancia: 0
    - id: H1.04
      escopo: "coroas"
      predicao: "desvio não cresce de N_min para 2·N_min e 4·N_min, e a contenção vale nos três"
      tolerancia: "H1.01"
    - id: H1.05
      escopo: "RWY e SWY (H1b, posição)"
      predicao: "geometria gerada das premissas do AD 2.12 coincide com o contorno da carta"
      metrica: "distância de Hausdorff"
      tolerancia_m: 1.95
      origem: "r_cal (0,18 m, calibrar_adc.py) + meia espessura do traço (1,77 m)"

# ---------------------------------------------------------------------------

H3:
  afirmacao: "O ledger retém tudo e evidencia adulteração."
  refutada_se: "alguma adulteração dentro do modelo de ameaça passar sem detecção."

  hash:
    entrada: >-
      Todos os campos do envelope (event_id, run_id, feature_id, feature_type,
      event_type, asserted_by, owner_ref, reason, caused_by, prev_hash) e todas
      as linhas de event_field do evento, ordenadas por path, em JCS (RFC 8785).
    verify_chain: "recalcula o hash do conteúdo atual de cada evento e confere a ligação prev_hash; devolve o primeiro event_id divergente, ou vazio"
    caused_by: "novo campo de envelope: event_id do evento que motivou esta escrita (ex.: DELTA de referencial)"

  modelo_de_ameaca:
    atacante: "escrita direta no Postgres (UPDATE, DELETE, INSERT), sem passar por append_event"
    fora_do_alcance_sem_ancora: >-
      Alterações que não deixam sucessor na cadeia (mexer na cabeça, truncar,
      reescrever da posição k até a cabeça) são indistinguíveis de uma
      história legítima para quem só olha o banco. Elas são previstas como
      não detectadas por verify_chain, e detectadas só contra uma âncora.
    ancora: >-
      Hash da cabeça impresso ao fim de cada ato e registrado no repositório
      (commit). Decisão em aberto: entra na arquitetura ou fica como limite
      declarado. As predições cobrem os dois casos.

  execucao: "sobre uma cópia do banco ao fim do ato 5, restaurada antes de cada ataque; k = evento do meio, cabeça = último evento"

  verificacoes:                    # resultado exato: detectado ou não, e qual event_id
    - {id: H3.01, ataque: "UPDATE em event_field.next do evento k, sem recalcular hash",          verify_chain: "detecta, devolve k",   com_ancora: detecta}
    - {id: H3.02, ataque: "UPDATE no corpo de k recalculando o hash de k",                        verify_chain: "detecta, devolve k+1", com_ancora: detecta}
    - {id: H3.03, ataque: "UPDATE em asserted_by de k, sem recalcular hash",                      verify_chain: "detecta, devolve k",   com_ancora: detecta}
    - {id: H3.04, ataque: "DELETE de uma linha de event_field de k",                              verify_chain: "detecta, devolve k",   com_ancora: detecta}
    - {id: H3.05, ataque: "DELETE do evento k",                                                   verify_chain: "detecta, devolve k+1", com_ancora: detecta}
    - {id: H3.06, ataque: "INSERT entre k e k+1 com hash próprio correto e prev_hash = hash(k)",  verify_chain: "detecta, devolve k+1", com_ancora: detecta}
    - {id: H3.07, ataque: "UPDATE no corpo da cabeça recalculando o hash da cabeça",              verify_chain: "não detecta",          com_ancora: detecta}
    - {id: H3.08, ataque: "DELETE da cabeça (truncamento)",                                       verify_chain: "não detecta",          com_ancora: detecta}
    - {id: H3.09, ataque: "reescrita de k até a cabeça recalculando todos os hashes",             verify_chain: "não detecta",          com_ancora: detecta}
    - id: H3.10
      ataque: nenhum (retenção)
      predicao: "nº de eventos no banco ao fim do ato 5 = nº de chamadas a append_event no log do notebook; verify_chain vazio"
      tolerancia: 0
  nota: >-
    O plano previa "detecta corpo, envelope, deleção e inserção; não detecta a
    reescrita total". A posição do ataque importa: na cabeça, alteração e
    truncamento caem na mesma classe da reescrita total (H3.07–H3.09).

