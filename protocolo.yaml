H4:
  afirmacao: "Cada consumidor obtém via contrato só o que precisa, a custo viável."
  refutada_se: "o custo crescer com o histórico total, ou um contrato exigir estado materializado como fonte de verdade."

  desenho:
    eventos_relevantes: "os K eventos dos atos 1 a 4 lidos pelo contrato ADC (fixos em todas as escalas)"
    tamanhos: "N ∈ {10³, 10³·⁵, 10⁴, 10⁴·⁵, 10⁵, 10⁵·⁵, 10⁶} eventos no total"
    series:
      S1: "eventos irrelevantes em outras features (incidentes, obstáculos fora do ADC), intercalados no tempo"
      S2: "eventos irrelevantes nas MESMAS features do ADC, em camadas fora do contrato (ex.: manutencao.*, inspecao.*)"
    semente: 20261020
    medida: "mediana de 21 execuções após 3 de aquecimento, cache quente; reconstrução do estado em t e projeção do ADC"
    indices_exigidos: "event(feature_id, event_id); event_field(event_id, path); índice por (feature_id, prefixo de camada) para S2"
    hardware: "registrado na saída do script de escala"

  limite_da_inclinacao:
    valor: 0.10
    origem: >-
      Se o custo for dominado pela descida no índice (B-tree), t ∝ ln N. A
      inclinação média de ln t contra ln N entre 10³ e 10⁶ é então
      ln(ln 10⁶ / ln 10³) / ln 10³ = ln 2 / 6,91 = 0,100. Varredura sequencial
      daria 1,0. Custos fixos (os K eventos relevantes) só diminuem a inclinação.
    leitura: "inclinação acima de 0,10 indica componente que cresce mais que logaritmicamente com o histórico"

  verificacoes:
    - {id: H4.01, predicao: "inclinação log-log (MQO sobre os 7 pontos) da série S1 ≤ 0,10", tolerancia: "o próprio limite; IC 95% por bootstrap reportado"}
    - {id: H4.02, predicao: "inclinação log-log da série S2 ≤ 0,10", tolerancia: "idem", nota: "é o teste do contrato como lente: só passa se a peneira por camada usar índice antes do DISTINCT ON"}
    - {id: H4.03, predicao: "em N = 10⁶, o EXPLAIN das consultas de estado e de projeção não tem Seq Scan em event nem em event_field", tolerancia: 0}
    - {id: H4.04, predicao: "o plano da projeção do ADC só lê event, event_field e o corpo do referencial; nenhuma tabela de estado materializado", tolerancia: 0}
    - {id: H4.05, predicao: "ADC projetado com cache e recalculado do zero são idênticos em todo N", tolerancia: "igualdade exata do conteúdo canônico (JCS)"}
