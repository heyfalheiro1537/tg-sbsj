ambiente:
  semente_sintetica: 20261020     # fase C (epílogo); fixada aqui, não usada em H2
  elipsoide: "GRS80 (SIRGAS2000)"
  versoes: "registradas em ambiente.lock no passo 0, antes do congelamento"

premissas:                         # entram no ledger; nunca são comparadas a si mesmas
  THR16: {lat: "231310.79S", lon: "0455219.08W", elev_m: 619.3, gund_m: -2.6, fonte: F3, resolucao: '0,01"'}
  THR34: {lat: "231412.21S", lon: "0455112.46W", elev_m: 647,   gund_m: -3,   fonte: F3, resolucao: '0,01"'}
  largura_rwy_m: {valor: 45, fonte: F3}
  SWY: {comprimento_m: 283, largura_m: 45, posicao: "além da THR 34 (dá ASDA à RWY 16)", fonte: [F1, F3]}
  CWY: {valor: NIL, fonte: F3}
  VAR: {valor: "22°W", epoca: 2026, fonte: F1, papel: norma}
