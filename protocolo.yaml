# Protocolo de falseamento do TG — SBSJ
#
# Registrado ANTES da execução. O SHA-256 deste arquivo vai para o
# repositório (commit + tag) antes de qualquer célula do notebook rodar.
# Depois disso, este arquivo não muda: correção vira nova versão, com
# motivo, e o hash antigo continua citado.

protocolo:
  versao: "0.4"
  estado: pronto_para_congelar            # passa a "congelado" quando os bloqueios abaixo caírem
  historico:
    - {versao: "0.1", sha256: 17625641524769a5b2ede2d644b148510089e4c8961df52a7e20580306e32689, conteudo: "H2"}
    - {versao: "0.2", conteudo: "H1, H3 e H4 acrescentadas; caused_by no envelope"}
    - {versao: "0.4", conteudo: "unidade de teste de H1 = contorno como desenhado, sem segmentação manual"}
    - {versao: "0.3", conteudo: "tolerância de H1 = max(contrato, oráculo); calibração do ADC (r_cal = 0,18 m); extração de contornos"}
  pendencias_que_nao_bloqueiam:
    - "Citar os valores de exatidão do contrato ADC a partir do Catálogo de Dados Aeronáuticos (PANS-AIM App. 1, arquivo eletrônico) ou da Tab. A5-1 do Anexo 14 Vol. I, 7ª ed. (2016). Não muda veredito, salvo a condição registrada em H1.contrato_ADC.condicao_de_reabertura."
  bloqueios_para_congelar: []
  autor: Heyder
  data_rascunho: 2026-10-20

regras_gerais:
  tolerancia_por_hipotese: >-
    Nunca escolhida; cada uma sai de uma fonte declarada. H1: exatidão do
    contrato ADC e precisão medida da carta. H2: precisão de publicação (regra
    abaixo). H3: resultado exato (detectado ou não, e qual evento). H4: modelo
    de custo do índice.
  tolerancia: >-
    Para comparações com valores publicados: a soma, em pior caso (aritmética de intervalos), de meia
    unidade da última casa publicada de cada grandeza de entrada, propagada até
    a grandeza comparada, mais meia unidade da última casa do valor publicado
    com que se compara. O cálculo está em derivar_tolerancias.py (hash abaixo).
  veredito: "PASSOU se |observado − predito| ≤ tolerância; FALHOU caso contrário. Sem meio-termo."
  classificacao_de_falha: >-
    Uma falha só refuta a tese se a correção exigir violar um princípio da
    arquitetura (premissa retida, derivado não armazenado, ledger só de escrita,
    transaction-time). Caso contrário é falha de implementação: registrada com
    o valor observado, corrigida, e o teste reexecutado em nova versão do run.
  resolucoes_normativas: >-
    As resoluções usadas nas tolerâncias de H2 são exigidas pelo PANS-AIM
    (Doc 10066, 1ª ed. 2018, App. 2): AD 2.12 — rumos verdadeiros a 0,01°,
    dimensões ao metro, coordenadas de cabeceira a 0,01"; elevação e ondulação
    a 0,1 m em cabeceira de precisão e ao metro em não precisão (explica 619,3
    e −2,6 na RWY 16, PA-1, contra 647 e −3 na RWY 34, NPA); AD 2.13 —
    distâncias declaradas ao metro; AD 2.2 — variação magnética ao grau.
    O AD 2.12 exige também coordenadas do fim de pista, que o SBSJ não publica.
  independencia_do_oraculo: >-
    Nenhuma premissa valida a si mesma. Premissas vêm do AD 2.12; os derivados
    são comparados ao ADC e ao próprio AD 2.12 em campos que não entraram no
    modelo; o gabarito do ato 4 é outro algoritmo, em outro código (gabarito/).

